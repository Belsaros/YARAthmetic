[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yarithmetic"
version = "0.0.1"
description = "Generate self-contained YARA rules for algorithmic validation"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
