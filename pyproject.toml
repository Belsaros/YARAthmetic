[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yarithmetic"
version = "0.1.0"
description = "Generate self-contained YARA rules for algorithmic validation"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "base58: Base58 and Base58Check feasibility tests",
    "bech32: Bech32 and Bech32m tests",
    "luhn: Luhn tests",
]
